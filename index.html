<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>FoodLink</title>
</head>
<!--Mockup de la página de login -->
<body>
    <header>
        <h1> <a href="/index.html">FoodLink</a></h1>
        <h2>Tu comida favorita, más cerca que nunca</h2>
    </header>
    <main>
        <form action="/login.html" method="post">
            <label for="username">Usuario:</label>
            <input type="text" id="username" name="username" required>
            <br>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required>
            <br>
            <button type="submit">Iniciar Sesión</button>
        </form>
        <!-- Enlace para registrarse o recuperar contraseña -->
        <p><a href="/register.html">¿No tienes cuenta? Regístrate aquí</a></p>
        <p><a href="/forgot-password.html">¿Olvidaste tu contraseña? Recupérala aquí</a></p>
        <p> Accede como usuario o administrador según tus credenciales </p>
    </main>
    <footer class="footer">
        <p>&copy; 2026 FoodLink. Todos los derechos reservados.</p>
    </footer>
    <script>
        // Aquí hardcodeamos un usuario admin para pruebas y un usuario normal para pruebas
        const users = [
            { username: 'admin', password: 'admin123', role: 'admin' },
            { username: 'user', password: 'user123', role: 'user' }
        ];

        const form = document.querySelector('form');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');

        // Limpiar estilos de error al hacer click en los inputs
        usernameInput.addEventListener('focus', function() {
            this.style.borderColor = '#e0e0e0';
        });

        passwordInput.addEventListener('focus', function() {
            this.style.borderColor = '#e0e0e0';
        });

        form.addEventListener('submit', function(event) {
            event.preventDefault();
            const username = usernameInput.value;
            const password = passwordInput.value;

            const user = users.find(u => u.username === username && u.password === password);
            if (user) {
                window.location.href = user.role === 'admin' ? '/admin-dashboard.html' : '/user-dashboard.html';
            } else {

                //Ponemos mensaje de error <p> debajo del campo de contraseña con color rojo
                usernameInput.style.borderColor = '#fc3232';
                passwordInput.style.borderColor = '#fc3232';

                // Agregar mensaje de error
                let errorMessage = document.querySelector('.error-message');
                if (!errorMessage) {
                    errorMessage = document.createElement('p');
                    errorMessage.classList.add('error-message');
                    errorMessage.style.color = '#fc3232';
                    errorMessage.textContent = 'Usuario o contraseña incorrectos. Inténtalo de nuevo.';
                    form.appendChild(errorMessage);
                }
                
                form.classList.add('shaker');
                
                setTimeout(() => {
                    form.classList.remove('shaker');
                }, 300);
            }
        });
    </script>
</body>
</html>
